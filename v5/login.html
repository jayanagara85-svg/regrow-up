<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Regrow — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif'] },
      colors: { brand: { 50:'#f0fdf4',100:'#dcfce7',500:'#22c55e',600:'#16a34a',700:'#15803d' } },
    }},
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', ui-sans-serif; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-50 via-white to-green-50 flex items-center justify-center p-4">

<div class="w-full max-w-sm">
  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="w-14 h-14 bg-gradient-to-br from-brand-500 to-brand-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand-600/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.96c.4 2.91.5 5.5 0 8.04C18.27 17.96 14.84 21.45 11 20Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">Regrow</h1>
    <p class="text-sm text-gray-500 mt-1">Operator Dashboard</p>
  </div>

  <!-- Form -->
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <h2 class="text-base font-semibold text-gray-800 mb-5">Masuk ke Dashboard</h2>

    <div id="error-box" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Nomor Telepon</label>
        <input id="phone" type="tel" placeholder="08xxxxxxxxxx" required
          class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input id="password" type="password" placeholder="••••••••" required
          class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"/>
      </div>
      <button type="submit" id="btn-login"
        class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg transition flex items-center justify-center gap-2">
        <span id="btn-text">Masuk</span>
        <svg id="btn-spinner" class="hidden animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path></svg>
      </button>
    </form>
    <p class="mt-4 text-xs text-gray-400 text-center">Khusus operator & admin Regrow</p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Already logged in → redirect to dashboard
  if (window.API.auth.isAuthenticated()) {
    window.location.href = 'Dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone    = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const errBox   = document.getElementById('error-box');
    const btnText  = document.getElementById('btn-text');
    const spinner  = document.getElementById('btn-spinner');
    const btn      = document.getElementById('btn-login');

    errBox.classList.add('hidden');
    btnText.textContent = 'Memuat…';
    spinner.classList.remove('hidden');
    btn.disabled = true;

    try {
      await window.API.login(phone, password);
      window.location.href = 'Dashboard.html';
    } catch (err) {
      errBox.textContent = err.message || 'Login gagal. Periksa nomor dan password.';
      errBox.classList.remove('hidden');
    } finally {
      btnText.textContent = 'Masuk';
      spinner.classList.add('hidden');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
