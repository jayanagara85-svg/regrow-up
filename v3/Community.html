// ─── Helpers ────────────────────────────────────────────────────────────────

function relativeTime(iso) {
  const diff = (NOW - new Date(iso)) / 1000;
  if (diff < 60)     return `${Math.floor(diff)}d`;
  if (diff < 3600)   return `${Math.floor(diff/60)} mnt`;
  if (diff < 86_400) return `${Math.floor(diff/3600)} jam`;
  return `${Math.floor(diff/86_400)} hari`;
}
const initials = (name) => name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();

// ─── Toast ──────────────────────────────────────────────────────────────────

function Toast({ toast }) {
  if (!toast) return null;
  const isError = toast.kind === 'error';
  return (
    <div className="toast fixed bottom-6 right-6 z-50">
      <div className={`flex items-center gap-2.5 pl-3 pr-4 py-2.5 rounded-lg shadow-lg ${
        isError ? 'bg-rose-50 border border-rose-200' : 'bg-gray-900 text-white'}`}>
        {isError ? <XCircle size={16} className="text-rose-600"/> : <CheckCircle size={16} className="text-brand-400"/>}
        <span className={`text-sm font-medium ${isError ? 'text-rose-700' : 'text-white'}`}>{toast.msg}</span>
      </div>
    </div>
  );
}

// ─── Broadcast Composer ─────────────────────────────────────────────────────

const TEMPLATES = [
  { id:'reminder', label:'Pengingat pickup', text:'Halo {nama}! Pickup minggu ini hari Sabtu pukul 08.00. Pastikan sampah tekstil sudah dipisah dari sampah lain ya 🌱' },
  { id:'thanks',   label:'Ucapan terima kasih', text:'Terima kasih sudah ikut setor minggu lalu. Total komunitas kita berhasil mengumpulkan {kg} kg!' },
  { id:'event',    label:'Acara komunitas', text:'Yuk gabung di acara komunitas Sabtu depan! Ada workshop upcycling gratis untuk 30 orang pertama.' },
];

function BroadcastComposer({ community, onSend }) {
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [sentCount, setSentCount] = useState(null);
  const taRef = useRef(null);

  const charLimit = 600;
  const remaining = charLimit - text.length;
  const canSend = text.trim().length > 0 && text.length <= charLimit && !sending;

  const applyTemplate = (t) => {
    setText(t.text);
    requestAnimationFrame(() => taRef.current?.focus());
  };

  const submit = async () => {
    if (!canSend) return;
    setSending(true);
    // POST /api/communities/{id}/broadcast
    await new Promise(r => setTimeout(r, 900));
    setSentCount(community.member_count);
    setSending(false);
    onSend(community, text);
    setText('');
    setTimeout(() => setSentCount(null), 3000);
  };

  return (
    <div className="card p-5">
      <div className="flex items-start justify-between mb-3">
        <div>
          <h3 className="text-sm font-semibold text-gray-900 flex items-center gap-1.5">
            <Megaphone size={14} className="text-brand-700"/> Broadcast Pesan
          </h3>
          <p className="text-xs text-gray-500 mt-0.5">
            Kirim ke {community.member_count} anggota via WhatsApp
          </p>
        </div>
        <span className="badge bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-200/60">
          <Whatsapp size={10} className="mr-1"/> WhatsApp
        </span>
      </div>

      {/* Templates */}
      <div className="mb-2">
        <div className="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1.5">Template cepat</div>
        <div className="flex flex-wrap gap-1.5">
          {TEMPLATES.map(t => (
            <button key={t.id} onClick={()=>applyTemplate(t)}
              className="px-2.5 py-1 rounded-md text-[11px] font-medium bg-gray-50 hover:bg-brand-50 hover:text-brand-700 text-gray-600 border border-gray-100 transition">
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Textarea */}
      <div className="relative mt-2">
        <textarea
          ref={taRef}
          value={text}
          onChange={(e)=>setText(e.target.value)}
          placeholder={`Tulis pesan untuk ${community.name}…`}
          rows={5}
          className="w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white resize-none placeholder-gray-400"
        />
        <div className={`absolute bottom-2 right-3 text-[10px] font-medium ${
          remaining < 0 ? 'text-rose-600' : remaining < 50 ? 'text-amber-600' : 'text-gray-400'
        }`}>
          {remaining}
        </div>
      </div>

      {/* Variable hint */}
      <div className="mt-2 text-[10px] text-gray-400">
        Variabel: <code className="font-mono text-gray-500 bg-gray-50 px-1 rounded">{'{nama}'}</code> dan <code className="font-mono text-gray-500 bg-gray-50 px-1 rounded">{'{kg}'}</code> akan otomatis diisi.
      </div>

      {/* Send */}
      <div className="mt-4 flex items-center gap-2">
        <button onClick={submit} disabled={!canSend}
          className="flex-1 inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 disabled:bg-gray-200 disabled:text-gray-400 text-white text-sm font-semibold transition shadow-sm shadow-brand-600/20">
          {sending ? <><RefreshCw size={14} className="spin"/> Mengirim ke {community.member_count} anggota…</>
                   : <><Send size={14}/> Kirim Broadcast</>}
        </button>
        <button onClick={()=>setText('')} disabled={!text}
          className="px-3 py-2.5 rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 text-sm font-medium text-gray-600">
          Hapus
        </button>
      </div>

      {sentCount != null && (
        <div className="mt-3 anim-in p-3 rounded-lg bg-brand-50 border border-brand-200/60 flex items-center gap-2 text-xs text-brand-800">
          <CheckCircle size={14} className="text-brand-600"/> Pesan terkirim ke {sentCount} anggota.
        </div>
      )}
    </div>
  );
}

      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5">
          <span className="text-sm font-medium text-gray-900 truncate">{member.name}</span>
          {member.role === 'admin' && (
            <span className="badge bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-200/60 text-[10px] px-1.5 py-0">
              <Crown size={9} className="mr-0.5"/> Admin
            </span>
          )}
        </div>
        <div className="text-[11px] text-gray-400 flex items-center gap-1 font-mono">
          <Phone size={10}/> {member.phone}
        </div>
      </div>
      <div className="text-right flex-shrink-0">
        <div className="text-xs font-semibold text-gray-700">{member.pickups} pickup</div>
        <div className="text-[10px] text-gray-400">gabung {relativeTime(member.joined)} lalu</div>
      </div>
    </div>
  );
}

// ─── Page ───────────────────────────────────────────────────────────────────

function CommunityPage() {
  const [communities, setCommunities] = useState(MOCK_COMMUNITIES);
  const [selectedId, setSelectedId] = useState(MOCK_COMMUNITIES[0].id);
  const [search, setSearch] = useState('');
  const [memberSearch, setMemberSearch] = useState('');
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(()=>setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const selected = communities.find(c => c.id === selectedId);
  const members = MOCK_MEMBERS[selectedId] || [];
  const visibleCommunities = communities.filter(c =>
    !search || c.name.toLowerCase().includes(search.toLowerCase()) || c.location.toLowerCase().includes(search.toLowerCase())
  );
  const visibleMembers = members.filter(m =>
    !memberSearch || m.name.toLowerCase().includes(memberSearch.toLowerCase()) || m.phone.includes(memberSearch)
  );

  const onBroadcast = (community, text) => {
    setToast({ kind:'success', msg:`Broadcast terkirim ke ${community.member_count} anggota` });
  };

  return (
    <div className="flex min-h-screen">
      <Sidebar active="communities"/>
      <main className="flex-1 min-w-0">
        {/* Top bar */}
        <header className="h-16 px-8 bg-white/70 backdrop-blur border-b border-gray-100 flex items-center justify-between sticky top-0 z-20">
          <div>
            <div className="text-[11px] text-gray-400 font-medium uppercase tracking-wider">Rabu, 29 April 2026</div>
            <h1 className="text-[15px] font-semibold text-gray-900 leading-tight">Komunitas</h1>
          </div>
          <button className="relative w-9 h-9 rounded-lg border border-gray-100 hover:bg-gray-50 flex items-center justify-center text-gray-500"><Bell size={16}/></button>
        </header>

        <div className="p-8 space-y-6">
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <h2 className="text-2xl font-bold text-gray-900 tracking-tight">Komunitas Pengguna</h2>
              <p className="text-sm text-gray-500 mt-0.5">
                {communities.length} komunitas aktif · {communities.reduce((s,c)=>s+c.member_count,0)} anggota total
              </p>
            </div>
            <button className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium transition shadow-sm shadow-brand-600/20">
              <Plus size={14}/> Komunitas Baru
            </button>
          </div>

          {/* 2-column layout: list / detail */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            {/* Communities list */}
            <div className="card p-3 lg:col-span-4">
              <div className="relative mb-2">
                <Search size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"/>
                <input value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Cari komunitas…"
                  className="w-full pl-7 pr-2 py-1.5 text-xs bg-gray-50 border border-transparent rounded-md focus:outline-none focus:ring-2 focus:ring-brand-500"/>
              </div>
              <div className="space-y-1 max-h-[600px] overflow-y-auto">
                {visibleCommunities.map(c => (
                  <CommunityRow key={c.id} community={c} active={c.id===selectedId} onClick={()=>setSelectedId(c.id)}/>
                ))}
                {visibleCommunities.length === 0 && (
                  <div className="text-center py-8 text-xs text-gray-400">Tidak ada komunitas</div>
                )}
              </div>
            </div>

            {/* Member list */}
            <div className="card p-0 lg:col-span-8 overflow-hidden flex flex-col">
              {/* Header with community info */}
              <div className={`p-5 bg-gradient-to-br ${selected.color} text-white`}>
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl flex-shrink-0">
                      {selected.icon}
                    </div>
                    <div className="min-w-0">
                      <h3 className="text-lg font-bold leading-tight truncate">{selected.name}</h3>
                      <div className="text-xs opacity-90 mt-0.5 flex items-center gap-1.5">
                        <MapPin size={11}/> {selected.location}
                        <span className="opacity-50">·</span>
                        <Clock size={11}/> aktif {relativeTime(selected.last_active)} lalu
                      </div>
                    </div>
                  </div>
                  <a href={`Broadcast.html?id=${selected.id}`}
                     className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white text-xs font-semibold transition flex-shrink-0">
                    <Megaphone size={13}/> Broadcast
                  </a>
                </div>
                <p className="text-xs opacity-90 mt-3 leading-relaxed">{selected.desc}</p>
                {/* Stats */}
                <div className="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-white/20">
                  <div>
                    <div className="text-lg font-bold">{selected.member_count}</div>
                    <div className="text-[10px] opacity-75 uppercase tracking-wider">Anggota</div>
                  </div>
                  <div>
                    <div className="text-lg font-bold">{selected.weekly_kg} kg</div>
                    <div className="text-[10px] opacity-75 uppercase tracking-wider">Per Minggu</div>
                  </div>
                  <div>
                    <div className="text-lg font-bold">{(selected.weekly_kg / selected.member_count).toFixed(1)}</div>
                    <div className="text-[10px] opacity-75 uppercase tracking-wider">Kg/Anggota</div>
                  </div>
                </div>
              </div>

              {/* Member search */}
              <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between gap-2">
                <h4 className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Anggota ({members.length})</h4>
                <div className="relative">
                  <Search size={11} className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400"/>
                  <input value={memberSearch} onChange={(e)=>setMemberSearch(e.target.value)} placeholder="Cari nama / nomor"
                    className="pl-6 pr-2 py-1 text-[11px] bg-gray-50 border border-transparent rounded focus:outline-none focus:ring-1 focus:ring-brand-500 w-44"/>
                </div>
              </div>

              {/* Member list */}
              <div className="divide-y divide-gray-50 overflow-y-auto flex-1 max-h-[520px]">
                {visibleMembers.length === 0 ? (
                  <div className="p-12 text-center text-sm text-gray-400">
                    Tidak ada anggota yang cocok
                  </div>
                ) : visibleMembers.map((m, i) => <MemberRow key={m.id} member={m} index={i}/>)}
              </div>

              <div className="border-t border-gray-100 px-4 py-2.5 text-[11px] text-gray-400 bg-gray-50/40">
                Menampilkan {visibleMembers.length} dari {members.length} anggota
              </div>
            </div>

          </div>
        </div>
      </main>

      <Toast toast={toast}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CommunityPage/>);
</script>
</body>
</html>
