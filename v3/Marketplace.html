const Bell       = (p)=><Icon {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Icon>;

const RefreshCw  = (p)=><Icon {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></Icon>;
const CheckCircle= (p)=><Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></Icon>;
const XCircle    = (p)=><Icon {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></Icon>;
const Recycle    = (p)=><Icon {...p}><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></Icon>;
const Scale      = (p)=><Icon {...p}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></Icon>;
const MapPin     = (p)=><Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></Icon>;
const Plus       = (p)=><Icon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
const Tag        = (p)=><Icon {...p}><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></Icon>;
const Sparkles   = (p)=><Icon {...p}><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></Icon>;
const Filter     = (p)=><Icon {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
const ChevronRt  = (p)=><Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
const ChevronDn  = (p)=><Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>;
const X          = (p)=><Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
const Clock      = (p)=><Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;

// ─── Helpers ────────────────────────────────────────────────────────────────

const STATUS_LABELS = {
  open: 'Tersedia', matched: 'Dipasangkan', sold: 'Terjual', expired: 'Kadaluarsa',
};
const STATUS_CLASSES = {
  open:    'bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-200/60',
  matched: 'bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-200/60',
  sold:    'bg-gray-100 text-gray-600 ring-1 ring-inset ring-gray-200/60',
  expired: 'bg-rose-50 text-rose-700 ring-1 ring-inset ring-rose-200/60',
};
const STATUS_DOT = {
  open:'bg-brand-600', matched:'bg-blue-500', sold:'bg-gray-400', expired:'bg-rose-500',
};
const StatusBadge = ({ status }) => (
  <span className={`badge ${STATUS_CLASSES[status] || 'bg-gray-100 text-gray-700'}`}>
    <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${STATUS_DOT[status] || 'bg-gray-400'}`}></span>
    {STATUS_LABELS[status] || status}
  </span>
);

const GRADE_TINTS = {
  A:{bg:'bg-brand-50',text:'text-brand-700',label:'Layak jual ulang'},
  B:{bg:'bg-blue-50', text:'text-blue-700', label:'Perlu pembersihan'},
  C:{bg:'bg-amber-50',text:'text-amber-700',label:'Bahan upcycle'},
  D:{bg:'bg-rose-50', text:'text-rose-700', label:'Daur ulang serat'},
};

const formatRupiah = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');

function formatRelative(iso) {
  const diff = (NOW - new Date(iso)) / 1000;
  if (diff < 60)     return `${Math.floor(diff)}d`;
  if (diff < 3600)   return `${Math.floor(diff/60)} mnt`;
  if (diff < 86_400) return `${Math.floor(diff/3600)} jam`;
  return `${Math.floor(diff/86_400)} hari`;
}

// ─── Sidebar (matches Dashboard) ────────────────────────────────────────────

const navItems = [
  { id:'dashboard',   label:'Dashboard',   icon:LayoutGrid },
  { id:'pickups',     label:'Pickups',     icon:Package, badge:2 },
  { id:'marketplace', label:'Marketplace', icon:Store },
  { id:'communities', label:'Komunitas',   icon:Users },
  { id:'broadcast',   label:'Broadcast',   icon:Megaphone },
  { id:'channel',     label:'Channel',     icon:Newspaper },
];
function Sidebar({ active }) {
  return (
    <aside className="w-60 min-h-screen bg-white border-r border-gray-100 flex flex-col flex-shrink-0">
      <div className="flex items-center gap-2.5 px-5 py-5 border-b border-gray-100">
        <div className="w-9 h-9 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center shadow-sm shadow-brand-600/20">
          <Leaf className="text-white" size={18} />
        </div>
        <div>
          <div className="font-bold text-gray-900 text-[15px] leading-tight">Regrow</div>
          <div className="text-[11px] text-gray-400 leading-tight">Operator Dashboard</div>
        </div>
      </div>
      <nav className="flex-1 p-3 space-y-0.5">
        {navItems.map(({ id, label, icon: I, badge }) => {
          const isActive = id === active;
          return (
            <a key={id} href={({dashboard:'Dashboard.html',marketplace:'Marketplace.html',communities:'Community.html',broadcast:'Broadcast.html',channel:'Channel.html',pickups:'#'})[id] || '#'} className={`flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
              isActive ? 'bg-brand-50 text-brand-700' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}`}>
              <I size={16} className={isActive ? 'text-brand-700' : 'text-gray-400'} />
              <span className="flex-1">{label}</span>
              {badge ? <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded-full ${
                isActive ? 'bg-brand-600 text-white' : 'bg-amber-100 text-amber-700'}`}>{badge}</span> : null}
            </a>
          );
        })}
      </nav>
      <div className="p-3 border-t border-gray-100">
        <div className="flex items-center gap-2.5 px-2 py-2 rounded-lg">
          <div className="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-brand-700 flex items-center justify-center text-white text-xs font-semibold">RA</div>
          <div className="flex-1 min-w-0">
            <div className="text-xs font-semibold text-gray-800 truncate">Rina A.</div>
            <div className="text-[10px] text-gray-400 truncate">Operator · Bandung</div>
          </div>
          <button className="text-gray-300 hover:text-gray-600 p-1"><LogOut size={14}/></button>
        </div>
      </div>
    </aside>
  );
}

// ─── Listing Card ───────────────────────────────────────────────────────────

function ListingCard({ listing, index, onMatch, matching }) {
  const t = GRADE_TINTS[listing.grade];
  return (
    <article className="listing-card card overflow-hidden flex flex-col hover:shadow-md hover:-translate-y-px transition" style={{ animationDelay: `${index * 30}ms` }}>
      {/* Thumbnail */}
      <div className="relative h-32 textile-bg" style={{ backgroundColor: listing.thumb }}>
        {/* grade chip */}
        <div className={`absolute top-3 left-3 ${t.bg} ${t.text} px-2 py-0.5 rounded-md text-xs font-bold flex items-center gap-1 shadow-sm`}>
          Grade {listing.grade}
        </div>
        <div className="absolute top-3 right-3">
          <StatusBadge status={listing.status} />
        </div>
        {/* listing id watermark */}
        <div className="absolute bottom-2 right-3 font-mono text-[10px] text-gray-700/40 tracking-wider">
          {listing.id}
        </div>
        {/* Pickups count */}
        <div className="absolute bottom-2 left-3 inline-flex items-center gap-1 bg-white/80 backdrop-blur-sm px-1.5 py-0.5 rounded text-[10px] font-medium text-gray-700">
          <Package size={10} /> {listing.pickups} pickup
        </div>
      </div>

      {/* Body */}
      <div className="p-4 flex-1 flex flex-col">
        <div className="flex items-start justify-between gap-2">
          <div className="min-w-0">
            <h3 className="font-semibold text-gray-900 text-[15px] leading-tight truncate">
              {listing.waste_type}
            </h3>
            <div className="text-[11px] text-gray-400 mt-0.5">{t.label}</div>
          </div>
        </div>

        {/* Stats row */}
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-md bg-gray-50/70 p-2">
            <div className="flex items-center gap-1 text-[10px] text-gray-400 uppercase tracking-wider font-semibold">
              <Scale size={10}/> Berat
            </div>
            <div className="text-sm font-bold text-gray-900 mt-0.5">{listing.weight_kg} kg</div>
          </div>
          <div className="rounded-md bg-gray-50/70 p-2">
            <div className="flex items-center gap-1 text-[10px] text-gray-400 uppercase tracking-wider font-semibold">
              <Tag size={10}/> Estimasi
            </div>
            <div className="text-sm font-bold text-brand-700 mt-0.5">{formatRupiah(listing.price_estimate)}</div>
          </div>
        </div>

        {/* Meta */}
        <div className="mt-3 flex items-center justify-between text-[11px] text-gray-500">
          <div className="flex items-center gap-1 truncate">
            <MapPin size={11} className="text-gray-300 flex-shrink-0"/>
            <span className="truncate">{listing.origin}</span>
          </div>
          <div className="flex items-center gap-1 flex-shrink-0">
            <Clock size={11} className="text-gray-300"/>
            <span>{formatRelative(listing.created_at)} lalu</span>
          </div>
        </div>

        {/* Buyer (if matched/sold) */}
        {listing.buyer && (
          <div className="mt-3 flex items-center gap-2 p-2 rounded-md bg-blue-50/50 border border-blue-100">
            <div className="w-7 h-7 rounded-md bg-blue-600 flex items-center justify-center text-[10px] font-bold text-white">
              {listing.buyer.split(' ').map(s=>s[0]).slice(0,2).join('')}
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-[10px] text-blue-600 font-semibold uppercase tracking-wider">Pembeli</div>
              <div className="text-xs font-medium text-gray-800 truncate">{listing.buyer}</div>
            </div>
          </div>
        )}

        {/* Action */}
        <div className="mt-4 pt-3 border-t border-gray-50 flex gap-2">
          {listing.status === 'open' ? (
            <>
              <button
                onClick={() => onMatch(listing)}
                disabled={matching}
                className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold transition disabled:opacity-50 shadow-sm shadow-brand-600/20"
              >
                {matching ? <RefreshCw size={12} className="spin"/> : <Sparkles size={12}/>}
                Match Buyer
              </button>
              <button className="px-3 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500 text-xs font-medium transition">
                <ChevronRt size={14}/>
              </button>
            </>
          ) : listing.status === 'matched' ? (
            <button className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-semibold transition">
              <CheckCircle size={12}/> Konfirmasi Transaksi
            </button>
          ) : (
            <button className="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-gray-50 text-gray-500 text-xs font-medium" disabled>
              Listing ditutup
            </button>
          )}
        </div>
      </div>
    </article>
  );
}

// ─── Match Buyer Modal ──────────────────────────────────────────────────────

function MatchModal({ listing, onClose, onConfirm }) {
  const [picked, setPicked] = useState(MOCK_BUYERS[0].id);
  const [submitting, setSubmitting] = useState(false);
  if (!listing) return null;

  const submit = async () => {
    setSubmitting(true);
    const buyer = MOCK_BUYERS.find(b => b.id === picked);
    await new Promise(r => setTimeout(r, 700));
    onConfirm(listing, buyer);
    setSubmitting(false);
  };

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden" onClick={(e)=>e.stopPropagation()}>
        <div className="p-5 border-b border-gray-100 flex items-start justify-between">
          <div>
            <div className="text-xs text-gray-400 font-mono">{listing.id}</div>
            <h3 className="text-base font-bold text-gray-900 mt-0.5">Match Buyer</h3>
            <p className="text-xs text-gray-500 mt-0.5">
              {listing.waste_type} · {listing.weight_kg} kg · Grade {listing.grade}
            </p>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 p-1"><X size={18}/></button>
        </div>
        <div className="p-5">
          <div className="text-[11px] text-gray-400 font-medium uppercase tracking-wider mb-2">Buyer terdekat</div>
          <div className="space-y-2">
            {MOCK_BUYERS.map(b => {
              const active = picked === b.id;
              return (
                <label key={b.id} className={`flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition ${
                  active ? 'border-brand-300 bg-brand-50/40 ring-1 ring-brand-200' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'
                }`}>
                  <input type="radio" name="buyer" checked={active} onChange={()=>setPicked(b.id)} className="sr-only" />
                  <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-100 to-blue-200 flex items-center justify-center text-xs font-bold text-blue-700">{b.logo}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-semibold text-gray-900 truncate">{b.name}</div>
                    <div className="text-[11px] text-gray-500">{b.type} · {b.loc}</div>
                  </div>
                  <div className="text-right">
                    <div className={`text-[11px] font-semibold ${b.match >= 0.9 ? 'text-brand-700' : 'text-gray-500'}`}>
                      {Math.round(b.match * 100)}%
                    </div>
                    <div className="text-[10px] text-gray-400">match</div>
                  </div>
                </label>
              );
            })}
          </div>
          <div className="mt-5 flex gap-2">
            <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50">
              Batal
            </button>
            <button onClick={submit} disabled={submitting}
              className="flex-1 px-4 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold flex items-center justify-center gap-1.5 disabled:opacity-60">
              {submitting ? <RefreshCw size={14} className="spin"/> : <Sparkles size={14}/>}
              Pasangkan
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Toast ──────────────────────────────────────────────────────────────────

function Toast({ toast }) {
  if (!toast) return null;
  const isError = toast.kind === 'error';
  return (
    <div className="toast fixed bottom-6 right-6 z-50">
      <div className={`flex items-center gap-2.5 pl-3 pr-4 py-2.5 rounded-lg shadow-lg ${
        isError ? 'bg-rose-50 border border-rose-200' : 'bg-gray-900 text-white'
      }`}>
        {isError ? <XCircle size={16} className="text-rose-600"/> : <CheckCircle size={16} className="text-brand-400"/>}
        <span className={`text-sm font-medium ${isError ? 'text-rose-700' : 'text-white'}`}>{toast.msg}</span>
      </div>
    </div>
  );
}

// ─── Marketplace Page ───────────────────────────────────────────────────────

const STATUS_FILTERS = [
  { id:'all',     label:'Semua' },
  { id:'open',    label:'Tersedia' },
  { id:'matched', label:'Dipasangkan' },
  { id:'sold',    label:'Terjual' },
];

function Marketplace() {
  const [listings, setListings] = useState(MOCK_LISTINGS);
  const [statusFilter, setStatusFilter] = useState('open');
  const [typeFilter, setTypeFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [matching, setMatching] = useState(null); // listing
  const [matchingId, setMatchingId] = useState(null); // for inline spinner
  const [toast, setToast] = useState(null);
  const [refreshing, setRefreshing] = useState(false);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const wasteTypes = useMemo(() => {
    const set = new Set(listings.map(l => l.waste_type));
    return ['all', ...Array.from(set)];
  }, [listings]);

  const filtered = useMemo(() => {
    return listings.filter(l => {
      if (statusFilter !== 'all' && l.status !== statusFilter) return false;
      if (typeFilter !== 'all' && l.waste_type !== typeFilter) return false;
      if (search && !(
        l.waste_type.toLowerCase().includes(search.toLowerCase()) ||
        l.id.toLowerCase().includes(search.toLowerCase()) ||
        l.origin.toLowerCase().includes(search.toLowerCase())
      )) return false;
      return true;
    });
  }, [listings, statusFilter, typeFilter, search]);

  const stats = useMemo(() => {
    const open = listings.filter(l => l.status === 'open');
    const matched = listings.filter(l => l.status === 'matched');
    const totalKg = open.reduce((s,l)=>s+l.weight_kg, 0);
    const totalRp = open.reduce((s,l)=>s+l.price_estimate, 0);
    return { openCount: open.length, matchedCount: matched.length, totalKg, totalRp };
  }, [listings]);

  // ─── Actions ──────────────────────────────────────────────────────────────

  const openMatch = (listing) => setMatching(listing);

  const confirmMatch = async (listing, buyer) => {
    setMatchingId(listing.id);
    setMatching(null);
    // PATCH /api/marketplace/listings/{id}
    setListings(prev => prev.map(l => l.id === listing.id
      ? { ...l, status: 'matched', buyer: buyer.name }
      : l
    ));
    setToast({ kind:'success', msg:`${listing.id} dipasangkan dengan ${buyer.name}` });
    setMatchingId(null);
  };

  const refresh = async () => {
    setRefreshing(true);
    await new Promise(r => setTimeout(r, 600));
    setRefreshing(false);
    setToast({ kind:'success', msg:'Daftar listing diperbarui' });
  };

  const clearFilters = () => {
    setStatusFilter('all'); setTypeFilter('all'); setSearch('');
  };
  const hasFilters = statusFilter !== 'all' || typeFilter !== 'all' || search;

  return (
    <div className="flex min-h-screen">
      <Sidebar active="marketplace" />
      <main className="flex-1 min-w-0">
        {/* Top bar */}
        <header className="h-16 px-8 bg-white/70 backdrop-blur border-b border-gray-100 flex items-center justify-between sticky top-0 z-20">
          <div>
            <div className="text-[11px] text-gray-400 font-medium uppercase tracking-wider">Rabu, 29 April 2026</div>
            <h1 className="text-[15px] font-semibold text-gray-900 leading-tight">Marketplace</h1>
          </div>
          <div className="flex items-center gap-3">
            <div className="relative hidden md:block">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
              <input value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Cari listing, ID, lokasi…"
                className="w-72 pl-9 pr-3 py-2 text-sm bg-gray-50 border border-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white"/>
            </div>
            <button className="relative w-9 h-9 rounded-lg border border-gray-100 hover:bg-gray-50 flex items-center justify-center text-gray-500">
              <Bell size={16}/>
            </button>
          </div>
        </header>

        {/* Content */}
        <div className="p-8 space-y-6">
          {/* Title row */}
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <h2 className="text-2xl font-bold text-gray-900 tracking-tight">Listing Sampah Tekstil</h2>
              <p className="text-sm text-gray-500 mt-0.5">
                {stats.openCount} listing tersedia · {stats.totalKg.toFixed(1)} kg · estimasi {formatRupiah(stats.totalRp)}
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={refresh} className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-sm font-medium text-gray-700 transition">
                <RefreshCw size={14} className={refreshing ? 'spin' : ''}/> Refresh
              </button>
              <button className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium transition shadow-sm shadow-brand-600/20">
                <Plus size={14}/> Listing Baru
              </button>
            </div>
          </div>

          {/* Filter bar */}
          <div className="card p-3 flex items-center gap-3 flex-wrap">
            {/* Status pills */}
            <div className="flex gap-1 bg-gray-50 rounded-lg p-1">
              {STATUS_FILTERS.map(f => {
                const count = f.id === 'all' ? listings.length : listings.filter(l=>l.status===f.id).length;
                const active = statusFilter === f.id;
                return (
                  <button key={f.id} onClick={()=>setStatusFilter(f.id)}
                    className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      active ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-800'
                    }`}>
                    {f.label}
                    <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded ${
                      active ? 'bg-brand-100 text-brand-700' : 'bg-gray-200/60 text-gray-500'
                    }`}>{count}</span>
                  </button>
                );
              })}
            </div>

            {/* Divider */}
            <div className="w-px h-6 bg-gray-100"></div>

            {/* Waste type select */}
            <div className="relative">
              <Filter size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"/>
              <select value={typeFilter} onChange={(e)=>setTypeFilter(e.target.value)}
                className="appearance-none pl-7 pr-8 py-1.5 text-xs font-medium bg-gray-50 border border-transparent hover:border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-500 text-gray-700 cursor-pointer">
                {wasteTypes.map(t => (
                  <option key={t} value={t}>{t === 'all' ? 'Semua jenis sampah' : t}</option>
                ))}
              </select>
              <ChevronDn size={12} className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"/>
            </div>

            {/* Mobile search */}
            <div className="relative flex-1 max-w-xs md:hidden">
              <Search size={12} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"/>
              <input value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Cari…"
                className="w-full pl-7 pr-3 py-1.5 text-xs bg-gray-50 border border-transparent rounded-md focus:outline-none focus:ring-2 focus:ring-brand-500"/>
            </div>

            {hasFilters && (
              <button onClick={clearFilters} className="ml-auto inline-flex items-center gap-1 text-xs font-medium text-gray-500 hover:text-rose-600 px-2 py-1 transition">
                <X size={11}/> Reset filter
              </button>
            )}
          </div>

          {/* Grid */}
          {filtered.length === 0 ? (
            <div className="card p-16 text-center">
              <div className="w-14 h-14 mx-auto rounded-full bg-gray-50 flex items-center justify-center mb-3">
                <Store size={22} className="text-gray-300"/>
              </div>
              <p className="text-sm text-gray-700 font-medium">Tidak ada listing yang cocok</p>
              <p className="text-xs text-gray-400 mt-1">Coba ubah filter atau buat listing baru dari batch tersedia.</p>
              {hasFilters && (
                <button onClick={clearFilters} className="mt-4 inline-flex items-center gap-1 text-xs font-medium text-brand-700 hover:text-brand-900">
                  <X size={11}/> Reset filter
                </button>
              )}
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {filtered.map((l, i) => (
                <ListingCard
                  key={l.id}
                  listing={l}
                  index={i}
                  onMatch={openMatch}
                  matching={matchingId === l.id}
                />
              ))}
            </div>
          )}

          {/* Footer hint */}
          {filtered.length > 0 && (
            <div className="text-[11px] text-gray-400 text-center pt-2">
              Menampilkan {filtered.length} dari {listings.length} listing · diurutkan terbaru
            </div>
          )}
        </div>
      </main>

      <MatchModal listing={matching} onClose={()=>setMatching(null)} onConfirm={confirmMatch}/>
      <Toast toast={toast}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Marketplace />);
</script>

</body>
</html>
