// ─── Helpers ────────────────────────────────────────────────────────────────

function relativeTime(iso) {
  const diff = (NOW - new Date(iso)) / 1000;
  if (diff < 60)     return `${Math.floor(diff)} dtk lalu`;
  if (diff < 3600)   return `${Math.floor(diff/60)} mnt lalu`;
  if (diff < 86_400) return `${Math.floor(diff/3600)} jam lalu`;
  return `${Math.floor(diff/86_400)} hari lalu`;
}
const initials = (name) => name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();

// ─── Toast ──────────────────────────────────────────────────────────────────

function Toast({ toast }) {
  if (!toast) return null;
  const isError = toast.kind === 'error';
  return (
    <div className="toast fixed bottom-6 right-6 z-50">
      <div className={`flex items-center gap-2.5 pl-3 pr-4 py-2.5 rounded-lg shadow-lg ${
        isError ? 'bg-rose-50 border border-rose-200' : 'bg-gray-900 text-white'}`}>
        {isError ? <XCircle size={16} className="text-rose-600"/> : <CheckCircle size={16} className="text-brand-400"/>}
        <span className={`text-sm font-medium ${isError ? 'text-rose-700' : 'text-white'}`}>{toast.msg}</span>
      </div>
    </div>
  );
}

// ─── Confirm dialog ─────────────────────────────────────────────────────────

function ConfirmDialog({ open, title, body, onConfirm, onCancel, danger }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm" onClick={onCancel}>
      <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5" onClick={(e)=>e.stopPropagation()}>
        <h3 className="text-base font-bold text-gray-900">{title}</h3>
        <p className="text-sm text-gray-600 mt-1.5 leading-relaxed">{body}</p>
        <div className="mt-5 flex gap-2">
          <button onClick={onCancel} className="flex-1 px-3 py-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50">Batal</button>
          <button onClick={onConfirm} className={`flex-1 px-3 py-2 rounded-lg text-white text-sm font-semibold ${
            danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-brand-600 hover:bg-brand-700'}`}>
            Konfirmasi
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Post Composer ──────────────────────────────────────────────────────────

const COVER_PALETTE = ['#a7f3d0','#bfdbfe','#fbcfe8','#fde68a','#ddd6fe','#fecaca','#dcfce7'];

function PostComposer({ open, onClose, onSubmit, editing }) {
  const [title, setTitle] = useState('');
  const [body, setBody] = useState('');
  const [category, setCategory] = useState('announcement');
  const [cover, setCover] = useState(COVER_PALETTE[0]);
  const [pinned, setPinned] = useState(false);
  const [submitting, setSubmitting] = useState(false);

  useEffect(() => {
    if (editing) {
      setTitle(editing.title); setBody(editing.body);
      setCategory(editing.category); setCover(editing.cover); setPinned(editing.pinned);
    } else if (open) {
      setTitle(''); setBody(''); setCategory('announcement'); setCover(COVER_PALETTE[0]); setPinned(false);
    }
  }, [editing, open]);

  if (!open) return null;
  const canSave = title.trim().length > 3 && body.trim().length > 10 && !submitting;

  const submit = async () => {
    if (!canSave) return;
    setSubmitting(true);
    await new Promise(r => setTimeout(r, 600));
    onSubmit({ title: title.trim(), body: body.trim(), category, cover, pinned });
    setSubmitting(false);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full overflow-hidden flex flex-col max-h-[90vh]" onClick={(e)=>e.stopPropagation()}>
        <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <h3 className="text-base font-bold text-gray-900">{editing ? 'Edit Post' : 'Post Baru'}</h3>
            <p className="text-xs text-gray-500 mt-0.5">Bagikan berita atau pengumuman ke channel publik Regrow</p>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 p-1"><X size={18}/></button>
        </div>

        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          {/* Cover preview + picker */}
          <div>
            <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Cover</div>
            <div className="rounded-xl overflow-hidden h-32 flex items-center justify-center text-gray-700/40 mb-2"
                 style={{ backgroundColor: cover, backgroundImage:'repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 2px, transparent 2px 8px)' }}>
              <Image size={28}/>
            </div>
            <div className="flex gap-1.5 flex-wrap">
              {COVER_PALETTE.map(c => (
                <button key={c} onClick={()=>setCover(c)}
                  className={`w-7 h-7 rounded-md transition ring-2 ${cover===c ? 'ring-gray-900 scale-110' : 'ring-transparent hover:ring-gray-300'}`}
                  style={{backgroundColor:c}}/>
              ))}
            </div>
          </div>

          {/* Category */}
          <div>
            <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Kategori</div>
            <div className="flex flex-wrap gap-1.5">
              {CATEGORIES.map(c => (
                <button key={c.id} onClick={()=>setCategory(c.id)}
                  className={`px-3 py-1.5 rounded-md text-xs font-medium ring-1 ring-inset transition ${
                    category===c.id ? c.color : 'bg-white ring-gray-200 text-gray-500 hover:bg-gray-50'
                  }`}>{c.label}</button>
              ))}
            </div>
          </div>

          {/* Title */}
          <div>
            <label className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Judul</label>
            <input value={title} onChange={(e)=>setTitle(e.target.value)} placeholder="Judul post yang menarik perhatian"
              className="mt-1.5 w-full px-3 py-2.5 text-sm font-semibold bg-gray-50 border border-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white"/>
            <div className="text-[10px] text-gray-400 mt-1">{title.length}/120 karakter</div>
          </div>

          {/* Body */}
          <div>
            <label className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Isi Post</label>
            <textarea value={body} onChange={(e)=>setBody(e.target.value)} rows={6}
              placeholder="Tulis berita, pengumuman, atau tips di sini…"
              className="mt-1.5 w-full px-3 py-2.5 text-sm bg-gray-50 border border-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white resize-none leading-relaxed"/>
          </div>

          {/* Pin toggle */}
          <label className="flex items-center justify-between p-3 rounded-lg bg-amber-50/50 border border-amber-100 cursor-pointer">
            <div className="flex items-center gap-2.5">
              <Pin size={16} className="text-amber-700"/>
              <div>
                <div className="text-sm font-medium text-gray-900">Pin post di atas</div>
                <div className="text-[11px] text-gray-500">Tampil di urutan paling atas channel</div>
              </div>
            </div>
            <button type="button" onClick={()=>setPinned(!pinned)}
              className={`relative w-10 h-5.5 rounded-full transition ${pinned ? 'bg-amber-600' : 'bg-gray-300'}`}
              style={{height:'22px'}}>
              <span className={`absolute top-0.5 w-[18px] h-[18px] bg-white rounded-full transition shadow-sm ${pinned ? 'left-[20px]' : 'left-0.5'}`}/>
            </button>
          </label>
        </div>

        {/* Footer */}
        <div className="px-5 py-3 border-t border-gray-100 flex gap-2 bg-gray-50/40">
          <button onClick={onClose} className="px-4 py-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-sm font-medium text-gray-700">Batal</button>
          <button onClick={submit} disabled={!canSave}
            className="flex-1 inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 disabled:bg-gray-200 disabled:text-gray-400 text-white text-sm font-semibold transition shadow-sm shadow-brand-600/20">
            {submitting
              ? <><RefreshCw size={14} className="spin"/> Menyimpan…</>
              : <><Send size={14}/> {editing ? 'Simpan Perubahan' : 'Publikasikan'}</>}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Post Card ──────────────────────────────────────────────────────────────

function PostCard({ post, onTogglePin, onDelete, onEdit, removing, index }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const cat = CATEGORIES.find(c => c.id === post.category) || CATEGORIES[0];

  useEffect(() => {
    if (!menuOpen) return;
    const close = () => setMenuOpen(false);
    setTimeout(() => window.addEventListener('click', close, { once: true }), 0);
  }, [menuOpen]);

  return (
    <article className={`anim-in card overflow-hidden flex flex-col ${removing ? 'removing' : ''}`}
             style={{animationDelay:`${index*30}ms`}}>
      {/* Cover */}
      <div className="relative h-32" style={{
        backgroundColor: post.cover,
        backgroundImage:'repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 10px)',
      }}>
        {post.pinned && (
          <div className="absolute top-3 left-3 inline-flex items-center gap-1 bg-amber-500 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-sm">
            <Pin size={10}/> PINNED
          </div>
        )}
        <div className="absolute top-3 right-3 flex items-center gap-1.5">
          <span className={`badge ring-1 ring-inset ${cat.color} text-[10px] font-semibold`}>{cat.label}</span>
        </div>
      </div>

      {/* Body */}
      <div className="p-4 flex-1 flex flex-col">
        <h3 className="text-[15px] font-bold text-gray-900 leading-snug line-clamp-2">{post.title}</h3>
        <p className="mt-1.5 text-sm text-gray-600 leading-relaxed line-clamp-3">{post.body}</p>

        {/* Meta */}
        <div className="mt-3 pt-3 border-t border-gray-50 flex items-center justify-between text-[11px] text-gray-400">
          <div className="flex items-center gap-1.5 min-w-0">
            <div className="w-5 h-5 rounded-full bg-gradient-to-br from-emerald-100 to-brand-200 flex items-center justify-center text-[9px] font-bold text-brand-700 flex-shrink-0">
              {initials(post.author)}
            </div>
            <span className="truncate text-gray-600 font-medium">{post.author}</span>
            <span className="text-gray-300">·</span>
            <span className="whitespace-nowrap">{relativeTime(post.published_at)}</span>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            <span className="inline-flex items-center gap-0.5"><Eye size={11}/> {post.views.toLocaleString('id-ID')}</span>
            <span className="inline-flex items-center gap-0.5"><Heart size={11}/> {post.likes}</span>
          </div>
        </div>
      </div>

      {/* Actions */}
      <div className="px-4 py-2.5 border-t border-gray-50 bg-gray-50/30 flex items-center justify-between">
        <button onClick={()=>onTogglePin(post)}
          className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium transition ${
            post.pinned
              ? 'bg-amber-100 text-amber-800 hover:bg-amber-200'
              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
          <Pin size={11}/> {post.pinned ? 'Unpin' : 'Pin'}
        </button>

        <div className="flex items-center gap-1">
          <button onClick={()=>onEdit(post)} className="p-1.5 rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition" title="Edit">
            <Edit size={14}/>
          </button>
          <button onClick={()=>onDelete(post)} className="p-1.5 rounded-md text-gray-400 hover:text-rose-600 hover:bg-rose-50 transition" title="Hapus">
            <Trash size={14}/>
          </button>
        </div>
      </div>
    </article>
  );
}

// ─── Channel Page ───────────────────────────────────────────────────────────

function ChannelPage() {
  const [posts, setPosts] = useState(MOCK_POSTS);
  const [composerOpen, setComposerOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [removingIds, setRemovingIds] = useState(new Set());
  const [search, setSearch] = useState('');
  const [categoryFilter, setCategoryFilter] = useState('all');
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(()=>setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const filtered = useMemo(() => {
    return posts
      .filter(p => categoryFilter === 'all' || p.category === categoryFilter)
      .filter(p => !search ||
        p.title.toLowerCase().includes(search.toLowerCase()) ||
        p.body.toLowerCase().includes(search.toLowerCase())
      )
      .sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.published_at) - new Date(a.published_at);
      });
  }, [posts, categoryFilter, search]);

  const stats = useMemo(() => ({
    total: posts.length,
    pinned: posts.filter(p => p.pinned).length,
    views: posts.reduce((s,p)=>s+p.views, 0),
    likes: posts.reduce((s,p)=>s+p.likes, 0),
  }), [posts]);

  // Actions

  const togglePin = (post) => {
    // PATCH /api/channel/posts/{id} { pinned: !post.pinned }
    setPosts(prev => prev.map(p => p.id === post.id ? { ...p, pinned: !p.pinned } : p));
    setToast({ kind:'success', msg: post.pinned ? 'Post di-unpin' : 'Post berhasil di-pin' });
  };

  const requestDelete = (post) => {
    setConfirm({
      title: 'Hapus post?',
      body: `"${post.title}" akan dihapus permanen dari channel. Aksi ini tidak bisa dibatalkan.`,
      danger: true,
      onConfirm: () => doDelete(post),
    });
  };

  const doDelete = (post) => {
    setConfirm(null);
    setRemovingIds(prev => new Set(prev).add(post.id));
    setTimeout(() => {
      // DELETE /api/channel/posts/{id}
      setPosts(prev => prev.filter(p => p.id !== post.id));
      setRemovingIds(prev => { const n = new Set(prev); n.delete(post.id); return n; });
      setToast({ kind:'success', msg:'Post berhasil dihapus' });
    }, 250);
  };

  const submitPost = (data) => {
    if (editing) {
      setPosts(prev => prev.map(p => p.id === editing.id ? { ...p, ...data } : p));
      setToast({ kind:'success', msg:'Post berhasil diperbarui' });
      setEditing(null);
    } else {
      // POST /api/channel/posts
      const newPost = {
        id: 'p' + Date.now(),
        ...data,
        author: 'Rina A.',
        published_at: new Date().toISOString(),
        views: 0, likes: 0,
      };
      setPosts(prev => [newPost, ...prev]);
      setToast({ kind:'success', msg:'Post berhasil dipublikasikan' });
    }
  };

  return (
    <div className="flex min-h-screen">
      <Sidebar active="channel"/>
      <main className="flex-1 min-w-0">
        {/* Top bar */}
        <header className="h-16 px-8 bg-white/70 backdrop-blur border-b border-gray-100 flex items-center justify-between sticky top-0 z-20">
          <div>
            <div className="text-[11px] text-gray-400 font-medium uppercase tracking-wider">Rabu, 29 April 2026</div>
            <h1 className="text-[15px] font-semibold text-gray-900 leading-tight">Channel</h1>
          </div>
          <div className="flex items-center gap-3">
            <div className="relative hidden md:block">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"/>
              <input value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Cari post…"
                className="w-72 pl-9 pr-3 py-2 text-sm bg-gray-50 border border-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white"/>
            </div>
            <button className="relative w-9 h-9 rounded-lg border border-gray-100 hover:bg-gray-50 flex items-center justify-center text-gray-500"><Bell size={16}/></button>
          </div>
        </header>

        <div className="p-8 space-y-6">
          {/* Title row */}
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <h2 className="text-2xl font-bold text-gray-900 tracking-tight">Channel Berita</h2>
              <p className="text-sm text-gray-500 mt-0.5">
                {stats.total} post · {stats.pinned} di-pin · {stats.views.toLocaleString('id-ID')} total views
              </p>
            </div>
            <button onClick={()=>{ setEditing(null); setComposerOpen(true); }}
              className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium transition shadow-sm shadow-brand-600/20">
              <Plus size={14}/> Post Baru
            </button>
          </div>

          {/* Filter */}
          <div className="card p-3 flex items-center gap-3 flex-wrap">
            <div className="flex gap-1 bg-gray-50 rounded-lg p-1">
              <button onClick={()=>setCategoryFilter('all')}
                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition ${
                  categoryFilter==='all' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}>
                Semua
                <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded ${
                  categoryFilter==='all' ? 'bg-brand-100 text-brand-700' : 'bg-gray-200/60 text-gray-500'}`}>{posts.length}</span>
              </button>
              {CATEGORIES.map(c => {
                const count = posts.filter(p => p.category === c.id).length;
                const active = categoryFilter === c.id;
                return (
                  <button key={c.id} onClick={()=>setCategoryFilter(c.id)}
                    className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      active ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-800'}`}>
                    {c.label}
                    <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded ${
                      active ? 'bg-brand-100 text-brand-700' : 'bg-gray-200/60 text-gray-500'}`}>{count}</span>
                  </button>
                );
              })}
            </div>
            <div className="ml-auto text-xs text-gray-400">
              Menampilkan {filtered.length} post
            </div>
          </div>

          {/* Grid */}
          {filtered.length === 0 ? (
            <div className="card p-16 text-center">
              <div className="w-14 h-14 mx-auto rounded-full bg-gray-50 flex items-center justify-center mb-3">
                <Newspaper size={22} className="text-gray-300"/>
              </div>
              <p className="text-sm text-gray-700 font-medium">Belum ada post</p>
              <p className="text-xs text-gray-400 mt-1">Mulai bagikan berita atau pengumuman ke pengguna Regrow.</p>
              <button onClick={()=>{ setEditing(null); setComposerOpen(true); }}
                className="mt-4 inline-flex items-center gap-1 text-xs font-medium text-brand-700 hover:text-brand-900">
                <Plus size={12}/> Buat post pertama
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {filtered.map((p, i) => (
                <PostCard key={p.id} post={p} index={i}
                  removing={removingIds.has(p.id)}
                  onTogglePin={togglePin}
                  onDelete={requestDelete}
                  onEdit={(post) => { setEditing(post); setComposerOpen(true); }}/>
              ))}
            </div>
          )}
        </div>
      </main>

      <PostComposer
        open={composerOpen}
        editing={editing}
        onClose={()=>{ setComposerOpen(false); setEditing(null); }}
        onSubmit={submitPost}/>

      <ConfirmDialog
        open={!!confirm}
        title={confirm?.title}
        body={confirm?.body}
        danger={confirm?.danger}
        onConfirm={confirm?.onConfirm}
        onCancel={()=>setConfirm(null)}/>

      <Toast toast={toast}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChannelPage/>);
</script>
</body>
</html>
