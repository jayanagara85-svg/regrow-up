  /* Custom scrollbar in spirit of clean dashboard */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
  .card {
    background: #fff;
    border-radius: 0.75rem;
    border: 1px solid #f3f4f6;

    align-items: center;

    border-radius: 9999px;

  /* Spinner */

  .sparkline-bar { transition: opacity 0.15s; }

function formatRelative(iso) {
  const now = NOW;
  const d = new Date(iso);
  const diff = (now - d) / 1000;
  if (diff < 60)        return `${Math.floor(diff)} detik lalu`;
  if (diff < 3600)      return `${Math.floor(diff / 60)} menit lalu`;
  if (diff < 86_400)    return `${Math.floor(diff / 3600)} jam lalu`;
  return `${Math.floor(diff / 86_400)} hari lalu`;
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

// ─── Stat Card ──────────────────────────────────────────────────────────────

function Sparkline({ data, color = '#16a34a' }) {
  const max = Math.max(...data, 1);
  return (
    <svg viewBox="0 0 80 28" className="w-20 h-7" preserveAspectRatio="none">
      {data.map((v, i) => {
        const h = (v / max) * 24 + 2;
        return (
          <rect key={i}
                className="sparkline-bar"
                x={i * (80 / data.length) + 1}
                y={28 - h}
                width={(80 / data.length) - 2}
                height={h}
                rx="1.5"
                fill={color}
                opacity={0.25 + (i / data.length) * 0.7}
          />
        );
      })}
    </svg>
  );
}

function StatCard({ icon: I, label, value, sub, delta, deltaPositive, accent = 'brand', spark }) {
  const accents = {
    brand:  { bg: 'bg-brand-50',   ic: 'text-brand-700',   spark: '#16a34a' },
    amber:  { bg: 'bg-amber-50',   ic: 'text-amber-700',   spark: '#d97706' },
    violet: { bg: 'bg-violet-50',  ic: 'text-violet-700',  spark: '#7c3aed' },
    teal:   { bg: 'bg-teal-50',    ic: 'text-teal-700',    spark: '#0d9488' },
  }[accent];

  return (
    <div className="card stat-card p-5 transition hover:shadow-md hover:-translate-y-px">
      <div className="flex items-start justify-between">
        <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${accents.bg} ${accents.ic}`}>
          <I size={17} />
        </div>
        {spark && <Sparkline data={spark} color={accents.spark} />}
      </div>
      <div className="mt-4 flex items-baseline gap-2">
        <span className="text-3xl font-bold tracking-tight text-gray-900">{value}</span>
        {sub && <span className="text-sm text-gray-400 font-medium">{sub}</span>}
      </div>
      <div className="mt-1 flex items-center justify-between">
        <span className="text-xs text-gray-500">{label}</span>
        {delta != null && (
          <span className={`inline-flex items-center gap-0.5 text-xs font-medium ${
            deltaPositive ? 'text-brand-700' : 'text-rose-600'
          }`}>
            <TrendingUp size={11} className={deltaPositive ? '' : 'rotate-180'} />
            {delta}
          </span>
        )}
      </div>
    </div>
  );
}

// ─── Toast ──────────────────────────────────────────────────────────────────

function Toast({ toast }) {
  if (!toast) return null;
  const isError = toast.kind === 'error';
  return (
    <div className="toast fixed bottom-6 right-6 z-50">
      <div className={`flex items-center gap-2.5 pl-3 pr-4 py-2.5 rounded-lg shadow-lg ${
        isError ? 'bg-rose-50 border border-rose-200' : 'bg-gray-900 text-white'
      }`}>
        {isError
          ? <XCircle size={16} className="text-rose-600" />
          : <CheckCircle size={16} className="text-brand-400" />}
        <span className={`text-sm font-medium ${isError ? 'text-rose-700' : 'text-white'}`}>{toast.msg}</span>
      </div>
    </div>
  );
}

  B: { ring: 'ring-blue-200',   bg: 'bg-blue-50',   text: 'text-blue-700',   big: 'text-blue-600',   label: 'Perlu pembersihan' },

};

function GradeModal({ pickup, grade, onClose }) {
  if (!pickup || !grade) return null;
  const t = GRADE_TINTS[grade.grade];
  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-gray-100 flex items-center justify-between">
          <div>
            <div className="text-xs text-gray-400 font-mono">#{pickup.id.slice(0, 8).toUpperCase()}</div>
            <h3 className="text-base font-bold text-gray-900 mt-0.5">Hasil Penilaian AI</h3>
          </div>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-700 p-1">
            <XCircle size={18} />
          </button>
        </div>

        <div className="p-5">
          {/* Big grade */}
          <div className={`flex items-center gap-4 p-4 rounded-xl ${t.bg} ring-1 ring-inset ${t.ring}`}>
            <div className={`w-16 h-16 rounded-xl bg-white flex items-center justify-center shadow-sm`}>
              <span className={`text-4xl font-bold ${t.big}`}>{grade.grade}</span>
            </div>
            <div>

              <div className="text-xs text-gray-500 mt-0.5">
                Keyakinan {Math.round(grade.confidence * 100)}% · {grade.estimated_kg} kg
              </div>
            </div>
          </div>

          {/* Reasoning */}
          <div className="mt-4 p-3 rounded-lg bg-gray-50 border border-gray-100">
            <div className="text-[11px] text-gray-400 font-medium uppercase tracking-wider mb-1">
              Catatan Gemini
            </div>
            <p className="text-sm text-gray-700 leading-relaxed">{grade.reasoning}</p>
          </div>

          {/* Meta */}
          <dl className="mt-4 grid grid-cols-2 gap-3 text-sm">
            <div>
              <dt className="text-xs text-gray-400">User</dt>
              <dd className="text-gray-800 font-medium mt-0.5">{pickup.user}</dd>
            </div>
            <div>
              <dt className="text-xs text-gray-400">Jenis</dt>
              <dd className="text-gray-800 font-medium mt-0.5">{pickup.waste_type}</dd>
            </div>
          </dl>

          <div className="mt-5 flex gap-2">
            <button onClick={onClose} className="flex-1 px-4 py-2.5 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-gray-50">
              Tutup
            </button>
            <button className="flex-1 px-4 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium flex items-center justify-center gap-1.5">
              <CheckCircle size={14} /> Tandai Selesai
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Dashboard ──────────────────────────────────────────────────────────────

function Dashboard() {
  const [pickups, setPickups] = useState(MOCK_PICKUPS);
  const [toast, setToast] = useState(null);
  const [confirming, setConfirming] = useState(null); // pickup id loading
  const [viewingGrade, setViewingGrade] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [search, setSearch] = useState('');

  // Auto-dismiss toast
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  // Stats — pickups today
  const todayCount = useMemo(
    () => pickups.filter(p => new Date(p.created_at).toDateString() === NOW.toDateString()).length,
    [pickups]
  );
  const pendingGradingCount = useMemo(
    () => pickups.filter(p => p.status === 'pending' || p.status === 'confirmed' || p.status === 'grading').length,
    [pickups]
  );
  const completedCount = useMemo(
    () => pickups.filter(p => p.status === 'completed').length,
    [pickups]
  );
  const totalKg = useMemo(
    () => pickups.filter(p => p.status === 'completed').reduce((s, p) => s + (p.estimated_weight || 0), 0).toFixed(1),
    [pickups]
  );

  const recent = useMemo(() => {
    const sorted = [...pickups].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    const filtered = search
      ? sorted.filter(p =>
          p.location.toLowerCase().includes(search.toLowerCase()) ||
          p.user.toLowerCase().includes(search.toLowerCase()) ||
          p.waste_type.toLowerCase().includes(search.toLowerCase())
        )
      : sorted;
    return filtered.slice(0, 5);
  }, [pickups, search]);

  // ─── Actions ──────────────────────────────────────────────────────────────

  async function handleConfirm(id) {
    setConfirming(id);
    // Simulate API: PATCH /api/pickups/{id}
    await new Promise(r => setTimeout(r, 700));
    setPickups(prev => prev.map(p => p.id === id ? { ...p, status: 'confirmed' } : p));
    setConfirming(null);
    setToast({ kind: 'success', msg: 'Pickup berhasil dikonfirmasi' });
  }

  function handleViewGrade(pickup) {
    const grade = MOCK_GRADES[pickup.id] || {
      grade: 'B',
      confidence: 0.84,
      estimated_kg: pickup.estimated_weight || 5,
      reasoning: 'Sampah tekstil dalam kondisi cukup baik. Beberapa perlu pembersihan ringan sebelum dijual ulang.',
    };
    setViewingGrade({ pickup, grade });
  }

  async function handleRefresh() {
    setRefreshing(true);
    await new Promise(r => setTimeout(r, 600));
    setRefreshing(false);
    setToast({ kind: 'success', msg: 'Data terbaru dimuat' });
  }

  return (
    <div className="flex min-h-screen">
      <Sidebar active="dashboard" />

      <main className="flex-1 min-w-0">
        {/* Top bar */}
        <header className="h-16 px-8 bg-white/70 backdrop-blur border-b border-gray-100 flex items-center justify-between sticky top-0 z-20">
          <div>
            <div className="text-[11px] text-gray-400 font-medium uppercase tracking-wider">
              Rabu, 29 April 2026
            </div>
            <h1 className="text-[15px] font-semibold text-gray-900 leading-tight">
              Selamat siang, Rina 👋
            </h1>
          </div>
          <div className="flex items-center gap-3">
            <div className="relative hidden md:block">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
              <input
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Cari pickup, user, lokasi…"
                className="w-72 pl-9 pr-3 py-2 text-sm bg-gray-50 border border-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white"
              />
            </div>
            <button className="relative w-9 h-9 rounded-lg border border-gray-100 hover:bg-gray-50 flex items-center justify-center text-gray-500">
              <Bell size={16} />
              <span className="absolute top-2 right-2 w-1.5 h-1.5 bg-rose-500 rounded-full"></span>
            </button>
          </div>
        </header>

        {/* Content */}
        <div className="p-8 space-y-6">
          {/* Page title row */}
          <div className="flex items-end justify-between gap-4 flex-wrap">
            <div>
              <h2 className="text-2xl font-bold text-gray-900 tracking-tight">Dashboard</h2>
              <p className="text-sm text-gray-500 mt-0.5">
                Ringkasan operasional pickup sampah tekstil hari ini.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={handleRefresh}
                      className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-sm font-medium text-gray-700 transition">
                <RefreshCw size={14} className={refreshing ? 'spin' : ''} /> Refresh
              </button>
              <button className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium transition shadow-sm shadow-brand-600/20">
                <Plus size={14} /> Pickup Baru
              </button>
            </div>
          </div>

          {/* Stats */}
          <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard icon={Package}      label="Pickup hari ini"
                      value={todayCount}  sub="bookings"
                      delta="+18%" deltaPositive accent="brand"
                      spark={[3,4,2,5,6,4,7]} />
            <StatCard icon={Clock}        label="Menunggu grading"
                      value={pendingGradingCount} sub="antrian"
                      delta="−2"   deltaPositive accent="amber"
                      spark={[5,4,6,3,5,2,3]} />
            <StatCard icon={CheckCircle}  label="Selesai diproses"
                      value={completedCount} sub="hari ini"
                      delta="+24%" deltaPositive accent="violet"
                      spark={[1,2,2,3,4,5,6]} />
            <StatCard icon={Scale}        label="Total tonase"
                      value={totalKg}     sub="kg"
                      delta="+12%" deltaPositive accent="teal"
                      spark={[8,12,10,14,11,16,18]} />
          </section>

          {/* Recent + Quick actions */}
          <section className="grid grid-cols-1 xl:grid-cols-3 gap-4">
            {/* Recent table */}
            <div className="card xl:col-span-2 overflow-hidden p-0">
              <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100">
                <div>
                  <h3 className="text-sm font-semibold text-gray-900">Pickup Terbaru</h3>
                  <p className="text-xs text-gray-400 mt-0.5">5 booking paling baru dari WhatsApp</p>
                </div>
                <a href="#" className="text-xs font-medium text-brand-700 hover:text-brand-900 inline-flex items-center gap-1">
                  Lihat semua <ChevronRt size={12} />
                </a>
              </div>

              {recent.length === 0 ? (
                <div className="p-12 text-center">
                  <p className="text-gray-400 text-sm">Tidak ada pickup yang cocok</p>
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="bg-gray-50/70 text-[11px] uppercase tracking-wider text-gray-500">
                        <th className="text-left px-5 py-2.5 font-semibold">Pickup</th>
                        <th className="text-left px-3 py-2.5 font-semibold">Lokasi</th>
                        <th className="text-left px-3 py-2.5 font-semibold">Status</th>
                        <th className="text-left px-3 py-2.5 font-semibold">Waktu</th>
                        <th className="text-right px-5 py-2.5 font-semibold">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-50">
                      {recent.map((p) => (
                        <tr key={p.id} className="hover:bg-gray-50/60 transition-colors group">
                          <td className="px-5 py-3">
                            <div className="flex items-center gap-3">
                              <div className="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-100 to-brand-200 flex items-center justify-center text-[11px] font-semibold text-brand-700 flex-shrink-0">
                                {p.user.split(' ').map(s => s[0]).slice(0,2).join('')}
                              </div>
                              <div className="min-w-0">
                                <div className="font-medium text-gray-900 truncate">{p.user}</div>
                                <div className="text-[11px] text-gray-400 flex items-center gap-1.5">
                                  <Recycle size={10} /> {p.waste_type}
                                  <span className="text-gray-300">·</span>
                                  <span className="font-mono">#{p.id.slice(0,6).toUpperCase()}</span>
                                </div>
                              </div>
                            </div>
                          </td>
                          <td className="px-3 py-3 max-w-[200px]">
                            <div className="flex items-start gap-1 text-gray-600 text-[13px]">
                              <MapPin size={12} className="text-gray-300 mt-0.5 flex-shrink-0" />
                              <span className="truncate">{p.location}</span>
                            </div>
                          </td>
                          <td className="px-3 py-3">
                            <StatusBadge status={p.status} />
                          </td>
                          <td className="px-3 py-3 text-gray-500 text-[13px] whitespace-nowrap">
                            <div>{formatRelative(p.created_at)}</div>
                            <div className="text-[11px] text-gray-400">{formatTime(p.created_at)}</div>
                          </td>
                          <td className="px-5 py-3 text-right">
                            <div className="inline-flex items-center gap-1">
                              {p.status === 'pending' && (
                                <button
                                  onClick={() => handleConfirm(p.id)}
                                  disabled={confirming === p.id}
                                  className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md bg-brand-50 hover:bg-brand-100 text-brand-700 text-xs font-medium transition disabled:opacity-50"
                                >
                                  {confirming === p.id
                                    ? <RefreshCw size={11} className="spin" />
                                    : <CheckCircle size={11} />}
                                  Konfirmasi
                                </button>
                              )}
                              {(p.status === 'graded' || p.status === 'grading') && (
                                <button
                                  onClick={() => handleViewGrade(p)}
                                  className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-md bg-violet-50 hover:bg-violet-100 text-violet-700 text-xs font-medium transition"
                                >
                                  <Eye size={11} /> Lihat Grade
                                </button>
                              )}
                              {(p.status === 'confirmed' || p.status === 'completed') && (
                                <button className="inline-flex items-center gap-1 px-2 py-1.5 rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-100 text-xs font-medium transition">
                                  <ChevronRt size={14} />
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            {/* Right column: Quick actions + activity */}
            <div className="space-y-4">
              {/* Quick actions */}
              <div className="card p-5">
                <h3 className="text-sm font-semibold text-gray-900">Aksi Cepat</h3>
                <p className="text-xs text-gray-400 mt-0.5">Tugas operator yang menunggu</p>

                <div className="mt-4 space-y-2">
                  {/* Confirm action */}
                  <button
                    onClick={() => {
                      const next = pickups.find(p => p.status === 'pending');
                      if (next) handleConfirm(next.id);
                    }}
                    disabled={!pickups.some(p => p.status === 'pending')}
                    className="w-full text-left p-3 rounded-lg border border-gray-100 hover:border-brand-200 hover:bg-brand-50/40 transition group disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    <div className="flex items-start gap-3">
                      <div className="w-8 h-8 rounded-lg bg-brand-50 group-hover:bg-brand-100 text-brand-700 flex items-center justify-center flex-shrink-0 transition">
                        <CheckCircle size={15} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-sm font-semibold text-gray-900">Konfirmasi pickup</span>
                          <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">
                            {pickups.filter(p => p.status === 'pending').length}
                          </span>
                        </div>
                        <p className="text-xs text-gray-500 mt-0.5">Setujui booking baru dari user</p>
                      </div>
                      <ArrowUpRt size={14} className="text-gray-300 group-hover:text-brand-700 mt-1 transition" />
                    </div>
                  </button>

                  {/* View grade */}
                  <button
                    onClick={() => {
                      const next = pickups.find(p => p.status === 'graded');
                      if (next) handleViewGrade(next);
                    }}
                    disabled={!pickups.some(p => p.status === 'graded')}
                    className="w-full text-left p-3 rounded-lg border border-gray-100 hover:border-violet-200 hover:bg-violet-50/40 transition group disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    <div className="flex items-start gap-3">
                      <div className="w-8 h-8 rounded-lg bg-violet-50 group-hover:bg-violet-100 text-violet-700 flex items-center justify-center flex-shrink-0 transition">
                        <Eye size={15} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-sm font-semibold text-gray-900">Lihat hasil grading</span>
                          <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-violet-100 text-violet-700">
                            {pickups.filter(p => p.status === 'graded').length}
                          </span>
                        </div>
                        <p className="text-xs text-gray-500 mt-0.5">Verifikasi penilaian AI Gemini</p>
                      </div>
                      <ArrowUpRt size={14} className="text-gray-300 group-hover:text-violet-700 mt-1 transition" />
                    </div>
                  </button>

                  {/* Marketplace */}
                  <a href="#" className="block p-3 rounded-lg border border-gray-100 hover:border-teal-200 hover:bg-teal-50/40 transition group">
                    <div className="flex items-start gap-3">
                      <div className="w-8 h-8 rounded-lg bg-teal-50 group-hover:bg-teal-100 text-teal-700 flex items-center justify-center flex-shrink-0 transition">
                        <Store size={15} />
                      </div>
                      <div className="flex-1 min-w-0">
                        <span className="text-sm font-semibold text-gray-900">Buat listing</span>
                        <p className="text-xs text-gray-500 mt-0.5">Pasarkan batch yang sudah di-grade</p>
                      </div>
                      <ArrowUpRt size={14} className="text-gray-300 group-hover:text-teal-700 mt-1 transition" />
                    </div>
                  </a>
                </div>
              </div>

              {/* Mini activity / today's progress */}
              <div className="card p-5">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-sm font-semibold text-gray-900">Progres Hari Ini</h3>
                  <span className="text-[11px] text-gray-400">{todayCount}/10 target</span>
                </div>

                {/* Progress bar */}
                <div className="h-2 rounded-full bg-gray-100 overflow-hidden">
                  <div
                    className="h-full bg-gradient-to-r from-brand-500 to-brand-700 rounded-full transition-all"
                    style={{ width: `${Math.min(100, (todayCount / 10) * 100)}%` }}
                  />
                </div>

                <div className="mt-4 grid grid-cols-3 gap-2 text-center">
                  <div>
                    <div className="text-lg font-bold text-gray-900">{pickups.filter(p => p.status === 'pending').length}</div>
                    <div className="text-[10px] text-gray-400 uppercase tracking-wider">Pending</div>
                  </div>
                  <div className="border-x border-gray-100">
                    <div className="text-lg font-bold text-gray-900">{pickups.filter(p => p.status === 'grading' || p.status === 'graded').length}</div>
                    <div className="text-[10px] text-gray-400 uppercase tracking-wider">Grading</div>
                  </div>
                  <div>
                    <div className="text-lg font-bold text-brand-700">{completedCount}</div>
                    <div className="text-[10px] text-gray-400 uppercase tracking-wider">Selesai</div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <Toast toast={toast} />
      {viewingGrade && (
        <GradeModal
          pickup={viewingGrade.pickup}
          grade={viewingGrade.grade}
          onClose={() => setViewingGrade(null)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Dashboard />);
</script>

</body>
</html>
